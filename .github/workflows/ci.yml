name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (with the development packages)
        run: npm ci --include=dev --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Rebuild the site and compare it with the committed build
        run: |
          set -euo pipefail
          npm run build:site
          # A build from this clean checkout must reproduce the committed
          # build/ exactly: no file changed, missing, added or dropped by
          # .gitignore.
          drift="$(git status --porcelain --ignored --untracked-files=all -- build)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift" | head -50
            echo "The committed build/ is not the build these sources produce."
            echo "Fix: run 'npm ci --include=dev && npm run clear && npm run build:site' and commit build/ with the sources."
            exit 1
          fi
          npm run check:sources
          npm run check:build
          # The built pages carry no node line; the server adds it at run time.
          if grep -rq 'Running on Ratio1' build; then
            echo "The built pages contain a node line."; exit 1
          fi
          # The footer paragraph and the script that fills it share one name.
          id="$(node -e "import('./src/clientModules/nodeLineElement.mjs').then((m) => console.log(m.NODE_LINE_ELEMENT_ID))")"
          grep -q "getElementById(\"$id\")" build/assets/js/main.*.js
          grep -q '/node-line.json' build/assets/js/main.*.js

      - name: Check the footer paragraph in the markup of every built page
        run: node scripts/check-footer.mjs

      - name: Simulate the node (clean clone, plain npm install, npm run build, npm start)
        run: bash scripts/node-checks.sh
