name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test the node id check
        run: npm run test:node-id

      - name: Build
        run: npm run build

      - name: Check that a build without a node id shows no node line
        run: |
          set -euo pipefail
          ! grep -q 'Running on Ratio1' build/index.html

      - name: Smoke-test the production server
        run: |
          set -euo pipefail
          PORT=3000 node scripts/server.mjs > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:3000/
          for h in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
            grep -qi "^$h:" headers.txt || { echo "missing header: $h"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/no-such-page)" = 404
          # Paths with a `..` segment are rejected, also when percent-encoded,
          # and only real content-hashed files are cached as immutable.
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'http://127.0.0.1:3000/assets/%2e%2e/search-index.json')" = 400
          curl -fsS -D index-headers.txt -o /dev/null 'http://127.0.0.1:3000/%73earch-index.json'
          grep -qi '^cache-control: no-cache' index-headers.txt
          redirect="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
            -H 'Host: edge-guardian.eu' -H 'CF-Visitor: {"scheme":"http"}' http://127.0.0.1:3000/docs/about/)"
          test "$redirect" = "301 https://edge-guardian.eu/docs/about/"
          # Hosts outside CANONICAL_HOSTS are served without a redirect.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: other.example' -H 'CF-Visitor: {"scheme":"http"}' http://127.0.0.1:3000/docs/about/)" = 200
          cat server.log

      - name: Check the production server for file-descriptor leaks
        run: node scripts/check-fd-leak.mjs

      - name: Build with a node id and check the footer line
        run: |
          set -euo pipefail
          R1EN_HOST_ID=ci-node-01 npm run build
          test "$(grep -o 'Running on Ratio1 low-resource edge-node ci-node-01' build/index.html | wc -l)" = 1
